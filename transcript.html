<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE TRANSCRIPT — the complete message record</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#10001f">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{margin:0;padding:0;background:#10001f;color:#e9ffe6;font-family:'IBM Plex Mono',ui-monospace,monospace}
  ::selection{background:#b026ff;color:#10001f}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
  header{border-bottom:1px solid #2a1245;padding:22px 0 14px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;letter-spacing:.12em;color:#39ff14;margin:0 0 6px;font-weight:700}
  .sub{font-size:11.5px;letter-spacing:.14em;color:#8fae7c}
  a{color:#39ff14}

  /* control bar */
  .bar{position:sticky;top:0;z-index:5;background:rgba(16,0,31,.96);border-bottom:1px solid #2a1245;
       padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bar input[type=search]{flex:1 1 280px;min-width:200px;background:#170a2b;border:1px solid #3a1c5e;color:#e9ffe6;
       font-family:inherit;font-size:13px;padding:8px 10px;border-radius:3px;outline:none}
  .bar input[type=search]:focus{border-color:#b026ff}
  .btn{background:#170a2b;border:1px solid #3a1c5e;color:#cfe6c4;font-family:inherit;font-size:11px;
       letter-spacing:.08em;padding:8px 10px;border-radius:3px;cursor:pointer}
  .btn:hover{border-color:#b026ff;color:#e9ffe6}
  .btn[aria-pressed=true]{border-color:#39ff14;color:#39ff14}
  .count{font-size:11px;color:#6f8a5e;letter-spacing:.06em;white-space:nowrap}

  /* legend — who is who, stated plainly */
  .legend{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:12px 0 2px;
          font-family:'Space Grotesk',sans-serif;font-size:13px;color:#cfe6c4}
  .legend b{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;
            padding:3px 8px;border-radius:3px;font-weight:600}
  .key-dan{background:#0d2b06;color:#39ff14;border:1px solid #39ff14}
  .key-annie{background:#2b0733;color:#ff5cf0;border:1px solid #e01aff}

  /* rows */
  #doc{padding-top:10px}
  .row{display:grid;grid-template-columns:58px 112px 78px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid #1b0b2e;
       content-visibility:auto;contain-intrinsic-size:auto 40px}
  .row.hide{display:none}
  .ln{color:#4b3a63;font-size:11px;text-align:right;padding-top:3px;user-select:none;
      text-decoration:none;display:block}
  .ln:hover{color:#39ff14;text-decoration:underline}
  .ts{color:#6f8a5e;font-size:11px;padding-top:3px;white-space:nowrap}
  .who{font-size:12px;font-weight:600;letter-spacing:.09em;padding-top:2px;white-space:nowrap}
  .row.tx-sent .who{color:#39ff14}
  .row.rx .who{color:#ff5cf0}
  .tx{font-family:'Space Grotesk',sans-serif;font-size:15.5px;line-height:1.58;white-space:pre-wrap;
      overflow-wrap:anywhere;color:#e9ffe6}
  .row.rx .tx{color:#f3dcf0}
  .row.tx-sent .tx{border-left:3px solid #39ff14;padding-left:11px}
  .row.rx .tx{border-left:3px solid #e01aff;padding-left:11px}
  .row.att .ts::after{content:' ATT';color:#b026ff;font-size:9px}
  .row.tap{opacity:.6}
  .row.cur{background:#26103d;outline:1px solid #b026ff;outline-offset:2px}
  .row.cur .ln{color:#e01aff;font-weight:600}
  /* arrived here from a link on an evidence page — say so, once */
  .row.landed{position:relative}
  .row.landed::before{content:'LINKED HERE';position:absolute;left:0;top:-9px;font-size:8.5px;
      letter-spacing:.16em;color:#10001f;background:#e01aff;padding:1px 6px;border-radius:2px}
  mark{background:#b026ff;color:#10001f;padding:0 1px}
  .note{font-size:12.5px;line-height:1.6;font-family:'Space Grotesk',sans-serif;color:#9db38f;
        padding:16px 0;max-width:80ch}
  #more{width:100%;margin:18px 0;padding:12px;text-align:center}
  @media(max-width:640px){
    .row{grid-template-columns:40px 1fr;gap:4px 8px}
    .ts{grid-column:2;font-size:10px;padding-top:0}
    .who{grid-column:2;padding-top:0}
    .tx{grid-column:2}
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>THE TRANSCRIPT</h1>
  <div class="sub" id="meta">LOADING…</div>
</header>

<div class="legend">
  <span><b class="key-dan">DAN</b> &nbsp;messages Dan sent</span>
  <span><b class="key-annie">ANNIE</b> &nbsp;messages Annie sent</span>
</div>

<div class="bar">
  <input type="search" id="q" placeholder="search the record —  or #1234 to jump to a line" autocomplete="off" spellcheck="false">
  <button class="btn" id="fAll" aria-pressed="true">BOTH</button>
  <button class="btn" id="fSent" aria-pressed="false">DAN ONLY</button>
  <button class="btn" id="fRecv" aria-pressed="false">ANNIE ONLY</button>
  <button class="btn" id="prev" title="previous match (Shift+Enter)">◀</button>
  <button class="btn" id="next" title="next match (Enter)">▶</button>
  <span class="count" id="count"></span>
</div>

<div id="doc"></div>
<button class="btn" id="more" hidden>LOAD MORE</button>
<div class="note" id="foot"></div>
</div>

<script>
(function(){
  var DOC=document.getElementById('doc'), Q=document.getElementById('q'),
      COUNT=document.getElementById('count'), META=document.getElementById('meta'),
      FOOT=document.getElementById('foot'), MORE=document.getElementById('more');
  var M=[];            // [ts, dir, text, flags]
  var LOW=[];          // lowercased text, for search
  var rows=[];         // DOM row per index (null until built)
  var built=0;         // how many rows have been built
  var CHUNK=1500;
  var dirFilter=0;     // 0 all, 1 sent, 2 received
  var term='', matches=[], cursor=-1;

  function esc(s){return s.replace(/[&<>]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;';});}

  function textHTML(i){
    var t=M[i][2];
    if(!term) return esc(t);
    var lo=LOW[i], out='', pos=0, k;
    while((k=lo.indexOf(term,pos))!==-1){
      out+=esc(t.slice(pos,k))+'<mark>'+esc(t.slice(k,k+term.length))+'</mark>';
      pos=k+term.length;
    }
    return out+esc(t.slice(pos));
  }

  function makeRow(i){
    var m=M[i], d=document.createElement('div');
    d.className='row '+(m[1]?'tx-sent':'rx')+(m[3]&1?' att':'')+(m[3]&2?' tap':'');
    d.id='L'+(i+1);
    d.innerHTML='<a class="ln" href="#L'+(i+1)+'" title="link to this message">'+(i+1)+
                '</a><div class="ts">'+m[0].slice(0,16)+
                '</div><div class="who">'+(m[1]?'DAN':'ANNIE')+
                '</div><div class="tx">'+textHTML(i)+'</div>';
    rows[i]=d;
    return d;
  }

  function visible(i){
    if(dirFilter===1&&M[i][1]!==1) return false;
    if(dirFilter===2&&M[i][1]!==0) return false;
    if(term&&LOW[i].indexOf(term)===-1) return false;
    return true;
  }

  // Build/refresh rows up to `built`; append more in chunks.
  function render(reset){
    if(reset){DOC.textContent='';built=0;rows=[];}
    grow();
  }

  function grow(){
    var frag=document.createDocumentFragment(), added=0, i=built;
    for(;i<M.length&&added<CHUNK;i++){
      if(!visible(i)) continue;
      frag.appendChild(makeRow(i));
      added++;
    }
    built=i;
    DOC.appendChild(frag);
    MORE.hidden = built>=M.length;
    updateCount();
  }

  function growUntil(idx){
    while(built<=idx && built<M.length) grow();
  }

  function updateCount(){
    if(term){
      COUNT.textContent = matches.length
        ? (cursor+1)+' / '+matches.length.toLocaleString()+' matches'
        : 'no matches';
    } else {
      COUNT.textContent = DOC.childElementCount.toLocaleString()+(built<M.length?'+':'')+
        ' of '+matches.length.toLocaleString()+(dirFilter?' shown':'');
    }
  }

  function recompute(){
    matches=[];
    for(var i=0;i<M.length;i++) if(visible(i)) matches.push(i);
    cursor=-1;
    render(true);
  }

  function jump(step){
    if(!matches.length) return;
    cursor=(cursor+step+matches.length)%matches.length;
    var idx=matches[cursor];
    growUntil(idx);
    var el=rows[idx];
    if(el){
      var prevCur=DOC.querySelector('.row.cur'); if(prevCur) prevCur.classList.remove('cur');
      el.classList.add('cur');
      el.scrollIntoView({block:'center'});
    }
    updateCount();
  }

  function gotoLine(n,landed){
    var idx=n-1;
    if(idx<0||idx>=M.length) return;
    growUntil(idx);
    var el=rows[idx];
    if(el){
      var prevCur=DOC.querySelector('.row.cur');
      if(prevCur){prevCur.classList.remove('cur');prevCur.classList.remove('landed');}
      el.classList.add('cur');
      if(landed) el.classList.add('landed');
      el.scrollIntoView({block:'center'});
    }
  }

  function fromHash(){
    var h=location.hash;
    if(/^#L\d+$/.test(h)) gotoLine(+h.slice(2),true);
  }
  addEventListener('hashchange',fromHash);

  var tmr;
  Q.addEventListener('input',function(){
    clearTimeout(tmr);
    tmr=setTimeout(function(){
      var v=Q.value.trim();
      if(/^#\d+$/.test(v)){term='';recompute();gotoLine(+v.slice(1));return;}
      term=v.toLowerCase();
      recompute();
      if(term) jump(1);
    },160);
  });
  Q.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();jump(e.shiftKey?-1:1);}
  });
  document.getElementById('next').onclick=function(){jump(1);};
  document.getElementById('prev').onclick=function(){jump(-1);};
  MORE.onclick=grow;

  function setDir(v){
    dirFilter=v;
    document.getElementById('fAll').setAttribute('aria-pressed',v===0);
    document.getElementById('fSent').setAttribute('aria-pressed',v===1);
    document.getElementById('fRecv').setAttribute('aria-pressed',v===2);
    recompute();
  }
  document.getElementById('fAll').onclick=function(){setDir(0);};
  document.getElementById('fSent').onclick=function(){setDir(1);};
  document.getElementById('fRecv').onclick=function(){setDir(2);};

  // keep filling as the reader scrolls
  addEventListener('scroll',function(){
    if(MORE.hidden) return;
    if(innerHeight+scrollY > document.body.offsetHeight-1200) grow();
  },{passive:true});

  fetch('data/transcript.json').then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    M=j.m;
    for(var i=0;i<M.length;i++) LOW[i]=M[i][2].toLowerCase();
    var sent=0; for(i=0;i<M.length;i++) if(M[i][1]) sent++;
    META.textContent=M.length.toLocaleString()+' MESSAGES  ·  '+j.first.slice(0,10)+' → '+j.last.slice(0,10)+
      '  ·  '+sent.toLocaleString()+' FROM DAN / '+(M.length-sent).toLocaleString()+' FROM ANNIE';
    FOOT.textContent='This is the complete message history between Dan and Annie, in the order it was '+
      'sent — every message, nothing removed and nothing edited. Each line says who sent it: DAN in '+
      'green, ANNIE in pink. The number on the far left is the line number, so any single message can '+
      'be pointed to exactly. Faded lines are reactions (a thumbs-up or a heart on someone else’s '+
      'message, not a message of its own). ATT marks a message that carried a photo or attachment.';
    recompute();
    fromHash();
  }).catch(function(e){
    META.textContent='FAILED TO LOAD data/transcript.json — '+e.message;
  });
})();
</script>
</body>
</html>
