<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/gate.js"></script>
<title>THE ORACLE — CHAPEL I — THE TEMPLE</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#041206">
<link rel="icon" href="data:,">

<!-- THE TEMPLE. An oracle over the complete message record: ask it something,
     and it answers with passages the corpus already contained. The draw is
     seeded by the question, so the same question always returns the same
     answer — see the long note at the top of js/temple.js for why that is the
     entire point rather than a limitation. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo+Black&amp;family=Chakra+Petch:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/slime.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: #041206; color: #e9ffe6;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; overflow-x: hidden; }

  /* The field sits behind everything, fixed, never scrolls. */
  #field { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; }
  #grain { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.34) 0 1px, transparent 1px 3px); }
  /* The field is bright enough to eat white text. This pulls the middle of the
     screen — the column everything is read in — down toward the ink, while
     leaving the edges at full intensity. */
  #scrim { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(4,18,6,.55), rgba(4,18,6,.30) 30%, rgba(4,18,6,.62)),
      radial-gradient(ellipse 58% 78% at 50% 50%, rgba(4,18,6,.80), rgba(4,18,6,.20) 70%, transparent); }

  .wrap { position: relative; z-index: 2; max-width: 940px; margin: 0 auto; padding: 40px 22px 140px; }

  header.t { text-align: center; padding: 6vh 0 4vh; }
  h1 { font-family: 'Anton', 'Chakra Petch', sans-serif; font-weight: 900;
    font-size: clamp(38px, 9vw, 104px); line-height: .92; letter-spacing: -.02em; margin: 0;
    color: #fff; text-shadow: 0 0 30px rgba(57,255,20,.85), 0 0 90px rgba(57,255,20,.45),
      0 0 160px rgba(176,38,255,.5); }
  .creed { margin-top: 18px; font-size: 11px; letter-spacing: .34em; color: #39ff14;
    text-shadow: 0 0 16px rgba(57,255,20,.9), 0 2px 12px #041206; text-transform: uppercase; }
  .scale { margin-top: 10px; font-size: 9.5px; letter-spacing: .22em; color: #b6ff8f; line-height: 2;
    text-shadow: 0 0 10px #041206, 0 0 22px #041206; }

  /* ── the altar ── */
  .altar { margin: 34px auto 0; max-width: 760px; border: 1px solid rgba(57,255,20,.5);
    background: rgba(3,13,7,.82); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    padding: 26px 24px; box-shadow: 0 0 90px rgba(57,255,20,.2); }
  .rites { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .rite { flex: 1 1 120px; cursor: pointer; background: none; border: 1px solid rgba(57,255,20,.35);
    color: #6f8a5e; font-family: inherit; font-size: 9.5px; letter-spacing: .24em; padding: 10px 6px;
    transition: all .15s ease; }
  .rite:hover { color: #b6ff8f; border-color: rgba(57,255,20,.7); }
  .rite[aria-pressed="true"] { color: #041206; background: #39ff14; border-color: #39ff14;
    box-shadow: 0 0 26px rgba(57,255,20,.5); }
  .ritehint { font-size: 9px; letter-spacing: .16em; color: #4f8a63; line-height: 1.9; margin-bottom: 16px;
    min-height: 17px; }

  .askrow { display: flex; gap: 10px; flex-wrap: wrap; }
  #ask { flex: 1 1 340px; background: rgba(0,0,0,.55); border: 1px solid rgba(57,255,20,.45);
    color: #b6ff8f; font-family: inherit; font-size: 14px; padding: 15px 15px; letter-spacing: .04em;
    outline: none; }
  #ask:focus { border-color: #00b7ff; box-shadow: 0 0 0 1px rgba(0,183,255,.35), 0 0 30px rgba(0,183,255,.25); }
  #ask::placeholder { color: #3d7a52; }
  #speak { flex: 0 0 auto; cursor: pointer; background: #39ff14; border: 1px solid #39ff14; color: #041206;
    font-family: inherit; font-weight: 700; font-size: 11px; letter-spacing: .22em; padding: 15px 26px; }
  #speak:hover { background: #b6ff8f; }
  #speak[disabled] { opacity: .5; cursor: default; }
  .status { margin-top: 13px; font-size: 9.5px; letter-spacing: .2em; color: #00b7ff; min-height: 15px; }

  /* ── the answer ── */
  /* Every block of the answer carries its own panel. The field stays fully
     visible around and between them, which is the whole look — but nothing
     that has to be *read* is ever set directly on top of it. */
  #answer { margin: 40px auto 0; max-width: 820px; }
  #answer > * { background: rgba(3,13,7,.86); backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px); border: 1px solid rgba(57,255,20,.28); }
  .sigwrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 20px 22px; margin-bottom: 18px; box-shadow: 0 0 60px rgba(57,255,20,.14); }
  #sig { width: 120px; height: 120px; flex: 0 0 auto; }
  .sigmeta { flex: 1 1 220px; }
  .qecho { font-family: 'Chakra Petch', sans-serif; font-size: 19px; line-height: 1.45; color: #fff;
    text-wrap: pretty; }
  .seedline { margin-top: 9px; font-size: 9px; letter-spacing: .2em; color: #6f8a5e; line-height: 1.9; }

  .verse { margin: 0 0 14px; padding: 18px 22px; opacity: 0; transform: translateY(14px);
    animation: rise .9s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .vhead { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; font-size: 9px;
    letter-spacing: .2em; margin-bottom: 8px; }
  .vnum { color: #b026ff; font-weight: 600; }
  .vwho { font-weight: 600; }
  .vwho.DAN { color: #39ff14; } .vwho.ANNIE { color: #ff86c9; }
  .vts { color: #4f8a63; }
  .vlink { margin-left: auto; color: #00b7ff; text-decoration: none; border-bottom: 1px solid transparent; }
  .vlink:hover { border-bottom-color: #00b7ff; }
  .vtext { font-family: 'Chakra Petch', sans-serif; font-size: 20px; line-height: 1.62; color: #e9ffe6;
    white-space: pre-wrap; overflow-wrap: anywhere; border-left: 3px solid #39ff14; padding-left: 18px; }
  .verse.ANNIE .vtext { border-left-color: #ff2f9d; color: #ffe1f2; }

  /* WORD rite: no dates, no attribution, just the words. */
  .words { display: flex; flex-wrap: wrap; gap: 14px 26px; justify-content: center; padding: 30px 24px; }
  .word { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: clamp(22px, 5.4vw, 54px); line-height: 1.1; color: #39ff14;
    text-shadow: 0 0 26px rgba(57,255,20,.8), 0 0 70px rgba(57,255,20,.4);
    opacity: 0; animation: rise .8s cubic-bezier(.2,.8,.3,1) forwards; }
  .word:nth-child(3n+2) { color: #ff2f9d; text-shadow: 0 0 26px rgba(255,47,157,.8), 0 0 70px rgba(255,47,157,.4); }
  .word:nth-child(3n+3) { color: #00b7ff; text-shadow: 0 0 26px rgba(0,183,255,.8), 0 0 70px rgba(0,183,255,.4); }

  .coda { margin-top: 14px; padding: 18px 22px;
    font-size: 9.5px; letter-spacing: .18em; color: #6f8a5e; line-height: 2.1; }
  .coda b { color: #b6ff8f; font-weight: 600; }

  .backrow { position: relative; z-index: 2; text-align: center; padding: 0 22px 60px;
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .chap { font-size: 10px; letter-spacing: .42em; color: #00ffa3; text-shadow: 0 0 14px rgba(0,255,163,.8); }
  .back { display: inline-block; font-size: 10px; letter-spacing: .24em; color: #00b7ff;
    text-decoration: none; border: 1px solid rgba(0,183,255,.5); padding: 10px 18px; }
  .back:hover { color: #041206; background: #00b7ff; }

  @media (prefers-reduced-motion: reduce) {
    .verse, .word { animation: none; opacity: 1; transform: none; }
  }
  @media (max-width: 640px) {
    .altar { padding: 20px 16px; }
    #sig { width: 92px; height: 92px; }
  }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div id="scrim" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div class="sl-drips l" aria-hidden="true">
  <i style="left:2px;--h:210px;--dur:15s;--del:0s"></i>
  <i class="pink" style="left:10px;--h:128px;--dur:19s;--del:3.5s"></i>
  <i style="left:6px;--h:300px;--dur:23s;--del:8s"></i>
</div>
<div class="sl-drips r" aria-hidden="true">
  <i style="right:3px;--h:250px;--dur:17s;--del:1.4s"></i>
  <i class="cer" style="right:11px;--h:110px;--dur:21s;--del:5s"></i>
  <i class="pink" style="right:14px;--h:340px;--dur:26s;--del:12s"></i>
</div>

<div class="wrap">
  <header class="t">
    <div class="chap">CHAPEL I</div>
    <h1>THE ORACLE</h1>
    <div class="creed">ASK IT SOMETHING · IT ANSWERS IN YOUR OWN WORDS</div>
    <div class="scale" id="scale">CONSULTING THE RECORD…</div>
  </header>

  <div class="altar">
    <div class="rites" role="group" aria-label="Rite">
      <button class="rite" type="button" data-rite="VERSE" aria-pressed="true">VERSE</button>
      <button class="rite" type="button" data-rite="WORD" aria-pressed="false">WORD</button>
      <button class="rite" type="button" data-rite="CHORUS" aria-pressed="false">CHORUS</button>
    </div>
    <div class="ritehint" id="ritehint">THREE PASSAGES, WHOLE, AS THEY WERE SENT.</div>
    <div class="askrow">
      <input id="ask" type="text" autocomplete="off" spellcheck="false"
             aria-label="Your question" placeholder="ask the record something…">
      <button id="speak" type="button" disabled>SPEAK ►</button>
    </div>
    <div class="status" id="status">LOADING THE RECORD…</div>
  </div>

  <div id="answer" aria-live="polite"></div>
</div>

<div class="backrow">
  <a class="back" href="./temple.html">◂ THE TEMPLE</a>
  <a class="back" href="./voice.html">CHAPEL II · THE VOICE ▸</a>
  <a class="back" href="./clock.html">CHAPEL III · THE CLOCK ▸</a>
</div>

<script src="./js/temple.js"></script>
<script>
(function () {
  var T = window.LVTemple;
  var askEl = document.getElementById('ask');
  var speakEl = document.getElementById('speak');
  var statusEl = document.getElementById('status');
  var answerEl = document.getElementById('answer');
  var scaleEl = document.getElementById('scale');
  var hintEl = document.getElementById('ritehint');
  var field = document.getElementById('field');
  var rite = 'VERSE';
  var busy = false;

  var HINTS = {
    VERSE:  'THREE PASSAGES, WHOLE, AS THEY WERE SENT.',
    WORD:   'SIX WORDS, STRIPPED OF THEIR SENTENCES. TERRY’S RITE, EXACTLY.',
    CHORUS: 'ONE MESSAGE AND THE THREE THAT FOLLOWED IT, IN REAL TIME.'
  };

  // The field runs regardless of whether the corpus has arrived — there is no
  // reason to stare at a flat background while 9 MB downloads.
  try {
    if (T.initField(field)) T.startField(field);
  } catch (e) {
    field.style.display = 'none';   // no WebGL: the page still works, just flat
  }
  window.addEventListener('pointermove', function (e) {
    T.state.mx = (e.clientX / window.innerWidth - 0.5) * 2;
    T.state.my = -(e.clientY / window.innerHeight - 0.5) * 2;
  });

  // Audio needs a gesture. Any gesture, once.
  var armed = false;
  function armAudio() {
    if (armed) return;
    armed = true;
    try { T.audio(); T.startDrone(); } catch (e) { /* no audio: everything else stands */ }
  }
  window.addEventListener('pointerdown', armAudio, { once: true });
  window.addEventListener('keydown', armAudio, { once: true });

  document.querySelectorAll('.rite').forEach(function (b) {
    b.addEventListener('click', function () {
      rite = b.getAttribute('data-rite');
      document.querySelectorAll('.rite').forEach(function (o) {
        o.setAttribute('aria-pressed', String(o === b));
      });
      hintEl.textContent = HINTS[rite];
    });
  });

  T.load().then(function (d) {
    var n = (d.count || (d.m && d.m.length) || 0).toLocaleString();
    var vocab = (T.vocab() || []).length.toLocaleString();
    scaleEl.innerHTML = n + ' MESSAGES &middot; ' + String(d.first).slice(0, 10)
      + ' → ' + String(d.last).slice(0, 10) + ' &middot; ' + vocab + ' DISTINCT WORDS';
    statusEl.textContent = 'THE RECORD IS OPEN. ASK.';
    speakEl.disabled = false;
    askEl.focus();
  }).catch(function (e) {
    statusEl.textContent = '✕ ' + String(e.message).toUpperCase();
  });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render(res) {
    answerEl.innerHTML = '';

    var head = document.createElement('div');
    head.className = 'sigwrap';
    var cv = document.createElement('canvas');
    cv.id = 'sig'; cv.width = 240; cv.height = 240;
    cv.style.width = '120px'; cv.style.height = '120px';
    head.appendChild(cv);
    var meta = document.createElement('div');
    meta.className = 'sigmeta';
    var q = document.createElement('div');
    q.className = 'qecho';
    q.textContent = '“' + (res.question || '(silence)') + '”';
    var sl = document.createElement('div');
    sl.className = 'seedline';
    sl.innerHTML = 'RITE ' + res.rite + ' &middot; SEED 0x' + res.seed.toString(16).toUpperCase()
      + '<br>THIS QUESTION WILL ALWAYS RETURN THIS ANSWER.';
    meta.appendChild(q); meta.appendChild(sl);
    head.appendChild(meta);
    answerEl.appendChild(head);
    T.sigil(cv, res.seed);

    if (res.rite === 'WORD') {
      var box = document.createElement('div');
      box.className = 'words';
      res.verses.forEach(function (v, i) {
        var w = document.createElement('div');
        w.className = 'word';
        w.style.animationDelay = (i * 0.34) + 's';
        w.textContent = v.word;
        box.appendChild(w);
        setTimeout(function () { T.strike(T.seedFrom(v.word)); }, i * 340);
      });
      answerEl.appendChild(box);
    } else {
      res.verses.forEach(function (v, i) {
        var el = document.createElement('div');
        el.className = 'verse ' + v.who;
        el.style.animationDelay = (i * 0.5) + 's';
        el.innerHTML =
          '<div class="vhead">' +
            '<span class="vnum">' + (i + 1) + '</span>' +
            '<span class="vwho ' + v.who + '">' + v.who + '</span>' +
            '<span class="vts">' + esc(String(v.ts).slice(0, 16)) + '</span>' +
            '<a class="vlink" href="./transcript.html#L' + v.line + '">LINE ' + v.line + ' ▸</a>' +
          '</div>' +
          '<div class="vtext">' + esc(v.text) + '</div>';
        answerEl.appendChild(el);
        setTimeout(function () { T.strike(T.seedFrom(v.text)); }, i * 500);
      });
    }

    var coda = document.createElement('div');
    coda.className = 'coda';
    coda.innerHTML = 'THE TEMPLE GENERATES NOTHING. EVERY WORD ABOVE WAS ALREADY IN THE RECORD, '
      + 'WRITTEN BY SOMEONE, ON A REAL DATE.<br>IT ONLY CHOSE — AND THE CHOICE WAS MADE BY '
      + '<b>YOUR QUESTION</b>, NOT BY CHANCE.';
    answerEl.appendChild(coda);
  }

  function consult() {
    if (busy || speakEl.disabled) return;
    armAudio();
    busy = true;
    speakEl.disabled = true;
    var question = askEl.value;
    var res = T.draw(question, rite);

    // The fold count comes out of the seed, so the geometry of the field is
    // part of the answer rather than a constant.
    T.state.fold = 4 + (res.seed % 9);
    T.state.tCharge = 1;
    statusEl.textContent = 'CONSULTING THE RECORD…';
    answerEl.innerHTML = '';

    setTimeout(function () {
      T.state.tCharge = 0.18;
      statusEl.textContent = 'IT ANSWERED.';
      render(res);
      busy = false;
      speakEl.disabled = false;
    }, 2100);
  }

  speakEl.addEventListener('click', consult);
  askEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); consult(); }
  });
})();
</script>
</body>
</html>
