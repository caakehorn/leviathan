name: Sync wiki data from wiki-brain

# Keeps data/wiki-data.json in step with the authoritative wiki source at
# github.com/caakehorn/wiki-brain.
#
# Fires three ways:
#   schedule            — hourly safety net; a no-op run costs ~20s
#   repository_dispatch — instant, if wiki-brain is set up to notify us
#                         (see README "Keeping the WIKI section in sync")
#   workflow_dispatch   — manual, with an optional force rebuild
#
# A push made with GITHUB_TOKEN does not trigger other workflows, so the Pages
# deploy is invoked explicitly as a dependent job rather than left to pages.yml's
# own push trigger.

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [wiki-brain-updated]
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if wiki-brain has not moved'
        type: boolean
        default: false

# Granted per job instead of workflow-wide: the sync job runs a third-party
# checkout and a pip install, and has no business holding the OIDC token-minting
# permission that only the Pages deploy needs.
permissions: {}

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout leviathan
        uses: actions/checkout@v4

      - name: Checkout wiki-brain
        uses: actions/checkout@v4
        with:
          repository: caakehorn/wiki-brain
          path: .wiki-brain
          # public repo; swap in a PAT here if it is ever made private
          # token: ${{ secrets.WIKI_BRAIN_TOKEN }}

      - name: Has wiki-brain moved?
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          upstream="$(git -C .wiki-brain rev-parse HEAD)"
          current="$(python3 -c "import json;print(json.load(open('data/wiki-data.json')).get('source_commit',''))" 2>/dev/null || echo '')"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "wiki-brain HEAD : $upstream"
          echo "built from      : ${current:-<none>}"
          if [ "$upstream" = "$current" ] && [ "$FORCE" != "true" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "already up to date — nothing to do"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.stale == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Required, not optional: without it the frontmatter's nested connections
      # and sources cannot be parsed and the build emits 0 typed edges.
      - name: Install PyYAML
        if: steps.check.outputs.stale == 'true'
        run: pip install 'pyyaml==6.*'

      - name: Rebuild wiki-data.json
        if: steps.check.outputs.stale == 'true'
        run: python3 tools/build-wiki-data.py --wiki-brain .wiki-brain

      # The "Discard a date-only rebuild" step that used to sit here is gone:
      # the dataset no longer carries a "generated" timestamp, so an unchanged
      # source now produces a byte-identical file and the `git diff --quiet`
      # below is sufficient on its own.

      - name: Commit and push
        id: commit
        if: steps.check.outputs.stale == 'true'
        env:
          UPSTREAM: ${{ steps.check.outputs.upstream }}
        run: |
          if git diff --quiet -- data/wiki-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "wiki-data.json is unchanged"
            exit 0
          fi
          # Counts resolved, non-self edges — the same definition build-wiki-data.py
          # reports and guards on, so the commit message and the build log agree.
          stats="$(python3 -c "
          import json
          d = json.load(open('data/wiki-data.json'))
          p = d['wikiPages']['pages']
          known = {x['id'] for x in p}
          print('%d pages, %d typed edges, %s words, %d log ops' % (
              len(p),
              sum(1 for x in p for c in x.get('connections', [])
                  if c.get('page') in known and c.get('page') != x['id']),
              format(sum(x.get('words', 0) for x in p), ','),
              len(d['wikiLog']['ops'])))
          ")"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/wiki-data.json
          git commit -m "Sync wiki data from wiki-brain@$UPSTREAM" -m "$stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "$stats" >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN pushes do not fire pages.yml on their own, so call it directly.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
