name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # sync-wiki.yml calls this after committing new wiki data: a push made with
  # GITHUB_TOKEN does not trigger the push event above.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but let an in-flight one finish. Cancelling is wrong
# here: sync-wiki.yml commits the new data and *then* calls this workflow, so a
# cancelled deploy leaves source_commit already matching upstream — the next
# hourly run sees nothing stale and never retries, stranding committed data
# unpublished until some unrelated push happens to trigger a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          # The whole repo root is the site (static, no build step).
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
